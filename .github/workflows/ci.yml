name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        run: |
          node --check index.js
          node --check client.js
          for file in src/host/*.js; do node --check "$file"; done
          echo "syntax ok"

      - name: Manifest and locales
        run: |
          node -e "const fs=require('fs');for(const f of ['package.json','locale/en.json','locale/zh.json'])JSON.parse(fs.readFileSync(f,'utf8'));console.log('json ok')"
          node -e "const p=require('./package.json');if(p.private===true||!p.dsh?.bundle?.patch||!p.exports?.['./client']||!p.exports?.['./icon']||!p.license||!p.repository?.url){console.error('manifest invalid');process.exit(1)};console.log('manifest ok')"

      - name: Packaging
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('pack.json','utf8'));const e=Array.isArray(p)?p[0]:Object.values(p)[0];const need=['index.js','client.js','cordis.patch.yml','icon.svg','locale/en.json','locale/zh.json','src/host/service.js','src/host/weixin.js'];const have=new Set(e.files.map(f=>f.path));const miss=need.filter(x=>!have.has(x));if(miss.length){console.error('missing files',miss);process.exit(1)};console.log('pack ok:',e.files.length,'files,',e.size,'bytes')"
