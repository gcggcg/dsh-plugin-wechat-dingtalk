name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, manifest and locale checks
        run: node scripts/check-syntax.mjs
      - name: Packaging check (npm pack --dry-run)
        run: node scripts/check-pack.mjs
